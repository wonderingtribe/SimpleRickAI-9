plugins {
    id 'com.android.application'
    id 'kotlin-android' // only if you use Kotlin
}

android {
    compileSdk 34

    defaultConfig {
        applicationId "com.simpleerick.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release { minifyEnabled false }
        debug { } // optional, defaults are fine
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
